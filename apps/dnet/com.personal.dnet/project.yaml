# ============================================================
# D-NET 动态网络管理系统 — UGOS Pro 原生应用
#
# 上游: https://github.com/cxbdasheng/dnet (v3.0.1, MIT)
# 形态: 原生应用 + open_type: tab
#
# 为什么是 tab 不是 inner:
#   dnet 自带完整 WebUI（登录/DCDN/DDNS/端口转发/日志），路由是
#   /、/dcdn、/ddns、/forward、/settings、/logs 等一整套，
#   收不进 inner 的单一 proxy_path 前缀；且它的登录 cookie 体系
#   与 UGOS 网关注入头是两套东西。tab = 浏览器直连应用端口，
#   由 dnet 自己的认证体系守门（首启 30 分钟内从内网设置账号密码、
#   bcrypt 存储、5 次失败锁 30 分钟、默认禁止公网访问）。
#
# 端口 19877: 避开上游默认 9877 —— 用户很可能已经在 NAS 的 Docker 里
#   跑着 dnet（默认发布的就是 9877），原生应用抢不到端口会起不来。
#
# 权限: NETWORK.ACCESS_INTERNET —— dcdn/ddns 要访问各云厂商 API（公网出站）。
#   真机零权限沙箱实测：公网 DNS 全被 DROP、dnet 的网络探测死循环起不来，
#   这条必须声明；除此之外零权限即可（start_cmd 不经 shell，无需 EXEC）。
# ============================================================

spec_version: "2.1"
app_id: com.personal.dnet
version: 3.0.1

support_arch:
  - amd64
  - arm64

supports:
  - pc
  - app

# start_cmd 指向管理壳（直接是编译好的二进制，不经 shell，无需 EXEC 权限）
start_cmd: bin/dnet_launcher
port: 19877

# 浏览器新标签页直连应用端口，由 dnet 自带登录认证守门
open_type: tab

# 端口对局域网开放，桌面图标只给管理员显示，避免普通用户误入登录页
only_admin: true

tag_types:
  - utility
  - system

depend_fw_version: 1.13.0.0000

support_migration: true

# dnet 的核心功能是访问各云厂商 API（阿里云/腾讯云/百度云/Cloudflare/华为云等）
# 更新 CDN 源站与 DNS 记录，必须放行公网出站
permissions:
  - NETWORK.ACCESS_INTERNET

# 开源合规：上游 MIT
license_agreement_link:
  - https://github.com/cxbdasheng/dnet/blob/v3.0.1/LICENSE
source_code_link:
  - https://github.com/cxbdasheng/dnet/tree/v3.0.1

i18n:
  zh-CN:
    name: D-NET 动态网络管理
    description: >-
      轻量级动态网络管理工具：CDN 源站自动跟随 IP 变化更新（DCDN）、
      动态域名解析（DDNS）、TCP/UDP 端口转发（DPF），一个应用管完。

      动态 CDN：支持阿里云 CDN/DCDN/ESA、腾讯云 CDN/EdgeOne、百度云
      CDN/DRCDN、Cloudflare、又拍云以及自定义回调，IP 变了源站自动跟上。
      动态 DNS：支持 A/AAAA/CNAME/TXT 记录，覆盖阿里云、腾讯云、百度云、
      Cloudflare、华为云、DNSPod、NameSilo、GoDaddy 与自定义回调。
      端口转发：IPv4/IPv6 入口转发到指定 IP 或域名，支持来源白名单、
      连接数限制、超时设置与运行日志。

      变更可实时通过 Webhook 推送通知。首次打开会进入初始设置页：
      请在安装后 30 分钟内从内网完成账号密码设置（超时后在应用中心
      停止再启动一次即可重新进入），配置保存在 NAS 本机。
    author: cxbdasheng
    official: https://github.com/cxbdasheng/dnet
    help: https://github.com/cxbdasheng/dnet/wiki
    publisher: xw
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131
  en-US:
    name: D-NET
    description: >-
      Lightweight dynamic network manager: keep CDN origin IPs and DNS
      records in sync automatically, plus TCP/UDP port forwarding.

      Dynamic CDN: Aliyun CDN/DCDN/ESA, Tencent Cloud CDN/EdgeOne, Baidu
      Cloud CDN/DRCDN, Cloudflare, Upyun and custom callbacks. Dynamic DNS:
      A/AAAA/CNAME/TXT records on Aliyun, Tencent, Baidu, Cloudflare,
      Huawei Cloud, DNSPod, NameSilo, GoDaddy and custom callbacks. Port
      forwarding: IPv4/IPv6 ingress to any target with allowlists, connection
      limits, timeouts and logs. Webhook notifications on IP changes.

      On first open you set your own username and password (within 30
      minutes of install, from the local network; restart the app to
      re-arm the window if it lapses).
    author: cxbdasheng
    official: https://github.com/cxbdasheng/dnet
    help: https://github.com/cxbdasheng/dnet/wiki
    publisher: xw
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131
