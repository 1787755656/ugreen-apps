# ============================================================
# SakuraFrp 启动器 (樱花FRP 内网穿透客户端) — UGOS Pro 原生应用
# natfrp-service 3.1.8, 静态 Go 二进制, 自带本地 WebUI
# ============================================================

spec_version: "2.1"
app_id: com.natfrp.launcher
version: 2026.7.18

support_arch:
  - amd64
  - arm64

supports:
  - pc
  - app

# 启动命令: 我们的管理壳 launcher(接管 natfrp 子进程 + 提供 http 管理页)
start_cmd: bin/launcher --port=7101

# 管理页端口(launcher 的 http 服务; natfrp 自身在 7102/https, 由 launcher 内部拉起)
port: 7101

# 网关代理前缀: inner 模式下网关 serve www/ 的管理页, 把 /api 反代到 launcher(见 /api/status,/api/config)
proxy_path: api

# 打开方式: inner —— 在 UGOS 桌面内以独立窗口打开管理页(不用浏览器)。
# 管理页里的"打开樱花 WebUI"按钮仍会新开浏览器标签(natfrp 自签名 https 没法嵌 iframe)。
open_type: inner

# 应用类别
tag_types:
  - utility

# 最低固件版本(占位值, 正式上架前请联系绿联开发确认真实版本号)
depend_fw_version: 1.13.0.0000

# 支持迁移安装目录
support_migration: true

# 权限: 内网穿透必须联网; 启动脚本/服务需执行 frpc 子进程
permissions:
  - NETWORK.ACCESS_INTERNET
  - SYSTEM.EXEC_SYSTEM_COMMAND

# 说明: 实测本设备 UGOS 不会把安装参数(parameters)注入为环境变量(PARAM CHECK present=false),
# 故不使用 parameters; 访问密钥 / WebUI 密码改由 launcher 的管理页设置(写入 config.json 并重启 natfrp)。

# 合规信息(樱花FRP 为闭源商业服务客户端; 提供官方链接)
technical_support_link:
  - https://doc.natfrp.com/launcher/usage.html

i18n:
  en-US:
    name: SakuraFrp Launcher
    description: >-
      SakuraFrp (natfrp) intranet penetration client with an in-app management
      window. Set your access key and Web UI password, browse your tunnels and
      toggle which ones auto-start on this NAS, and enable remote management —
      all from the app, no manual IP or https needed. Tunnels expose your NAS
      services to the internet through SakuraFrp.
    author: NatFrp / SakuraFrp
    official: https://www.natfrp.com
    help: https://doc.natfrp.com/launcher/usage.html
    publisher: NatFrp
    publisher_link: https://www.natfrp.com
  zh-CN:
    name: 樱花FRP 启动器
    description: >-
      樱花 FRP（SakuraFrp）内网穿透客户端，带应用内管理窗口：在应用里就能设置访问密钥、
      Web UI 密码，查看隧道列表并控制哪些隧道在本机开机自启，以及开关远程管理，
      无需手动记 IP 或改 https。通过樱花 FRP 隧道将 NAS 服务映射到公网访问。
    author: NatFrp / SakuraFrp
    official: https://www.natfrp.com
    help: https://doc.natfrp.com/launcher/usage.html
    publisher: NatFrp
    publisher_link: https://www.natfrp.com
