<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deen 音乐下载器</title>
<style>
  :root { color-scheme: dark light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #17181c; color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .box { text-align: center; padding: 32px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.16);
    border-top-color: #4c8dff; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 6px 0; font-size: 14px; color: #9aa0a6; }
  a { color: #7fb0ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
<script>
  // 本应用是 inner 型：站点本体在 /api/ 前缀下（网关只反代 /api/*）。
  // 这里做一次同源跳转，登录态由上游自己判断（已登录直接进总览）。
  location.replace("/api/");
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>正在打开 Deen 音乐下载器…</p>
    <p>如果没有自动跳转，请点 <a href="/api/">这里</a>。</p>
  </div>
</body>
</html>
