name: adguardhome-ugreen
services:
  adguardhome:
    image: "personal/adguardhome:v0.107.80"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3080:3080/tcp"
    environment:
      TZ: "{{.TZ}}"
    volumes:
      - type: bind
        source: "{{ if .DATA_PATH }}{{ index .DATA_PATH 0 }}{{ else }}./data{{ end }}"
        target: /opt/adguardhome/conf
      - type: bind
        source: "{{ if .DATA_PATH }}{{ index .DATA_PATH 0 }}/work{{ else }}./data/work{{ end }}"
        target: /opt/adguardhome/work
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
