# 绿联 UGOS Pro 原生应用：m3u8下载器（N_m3u8DL-RE）
#
# 形态：inner + proxy_path=api
#   页面由网关从 www/ 直接 serve（前端是从 fnOS 版移植的静态站），
#   /api 前缀反代到本应用的 28940 端口（Go 管理壳）。
#   选 inner 而不是 tab 的原因：打开文件/目录要靠 cloudWindow 的 openApp 能力，
#   只有 inner 窗口里才有宿主桥。
spec_version: "2.1"

app_id: com.personal.nm3u8dlre
version: 0.6.0

support_arch:
  - amd64
  - arm64

supports:
  - pc
  - app

# start_cmd 直接用 Go 二进制，不经过 shell：
# 沙箱里 fork/exec 包内自带的二进制不需要任何权限，
# 省掉 SYSTEM.EXEC_SYSTEM_COMMAND 那一圈。
start_cmd: bin/nm3u8dlre --port=28940

port: 28940

open_type: inner
proxy_path: api

only_admin: true

tag_types:
  - download

depend_fw_version: 1.13.0.0000

allow_add_access_path: true
support_migration: true

# 【权限画像】只联网。
#   下载引擎要访问公网流媒体源站，引擎自升级要访问 GitHub —— 必需。
#   EXEC 不需要：start_cmd 是包内二进制，引擎/ffmpeg 也是包内绝对路径 exec，
#   链路上没有任何 sh 包装。实测零 EXEC 也能成立（见 monorepo openlist 的同类结论）。
permissions:
  - NETWORK.ACCESS_INTERNET

parameters:
  - key: DOWNLOAD_DIR
    type: path
    multi: false
    changeable: true
    required: false
    i18n:
      zh-CN:
        name: 下载目录
        description: >-
          下载完成的视频保存到哪个文件夹。选中即完成授权，应用只能读写这里。
          不选也能装，但文件会落在应用数据目录（绿联文件管理器里看不到），
          页面顶部会给出提示。
          选完保存后如果目录还没生效，应用会自己重启一次（约 10 秒），不用手动停止再启动。
      en-US:
        name: Download folder
        description: >-
          Where finished files are saved. Selecting a folder also grants access,
          and the app can only touch that folder. Leaving it empty stores files in
          the app data directory, which the file manager does not show (the page
          will warn you). If the folder is not effective yet, the app restarts
          itself once (about 10 seconds) - no manual stop/start needed.

license_agreement_link:
  - https://github.com/nilaoda/N_m3u8DL-RE/blob/main/LICENSE

source_code_link:
  - https://github.com/nilaoda/N_m3u8DL-RE
  - https://github.com/Youngxj/N_m3u8DL-RE-FN

technical_support_link:
  - https://github.com/nilaoda/N_m3u8DL-RE/issues

i18n:
  zh-CN:
    name: m3u8下载器
    description: >-
      把开源工具 N_m3u8DL-RE 做成绿联 NAS 上的可视化流媒体下载器，粘贴 m3u8 /
      DASH / MSS 链接就能下载，不用开电脑也不用记命令。任务进度、速度、分片数、
      剩余时间通过轮询引擎日志实时刷新，多端打开看到的是同一份状态。
      支持点播与直播录制、多线程分片下载、自动挑选最佳音视频、AES 解密、
      字幕单独下载，完成后可自动混流成 mp4 或 mkv（包内自带静态 ffmpeg，
      不依赖系统）。引擎的全部命令行参数都做成了中文表单，勾选即可。
      已下载文件按任务归类，可以在应用里直接下载回电脑，也可以在文件管理器中定位。
      核心引擎支持在应用内一键升级到上游最新版，不影响已有任务。
      使用前请在应用设置里选择下载目录，应用只能访问选中的文件夹。
      仅供学习与技术研究，请只下载拥有合法权限的内容。
    author: Youngxj
    publisher: 穿斯帕沃特
    official: https://github.com/nilaoda/N_m3u8DL-RE
    help: https://github.com/Youngxj/N_m3u8DL-RE-FN#readme
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131
  en-US:
    name: m3u8 Downloader
    description: >-
      A visual front-end for N_m3u8DL-RE on Ugreen NAS. Paste an m3u8, DASH or MSS
      link and it downloads - no desktop, no command line. Progress, speed, segment
      count and ETA are polled from the engine log and stay in sync across clients.
      Supports VOD and live recording, multi-threaded segment download, automatic
      best-track selection, AES decryption, subtitle-only downloads, and optional
      muxing into mp4 or mkv with a bundled static ffmpeg. Every engine flag is
      exposed as a form field. Finished files are grouped per task and can be
      downloaded back or located in the file manager. The engine itself can be
      upgraded in-app to the latest upstream release without disturbing running
      tasks. Pick a download folder in the app settings first - the app can only
      access the folders you grant. For study and research only; download only
      content you are allowed to.
    author: Youngxj
    publisher: 穿斯帕沃特
    official: https://github.com/nilaoda/N_m3u8DL-RE
    help: https://github.com/Youngxj/N_m3u8DL-RE-FN#readme
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131
