# ============================================================
# Lucky — UGOS Pro 原生应用配置
# 3.4.0 起基于官方 wanji 发行版静态二进制 (release.66666.host, 自带 WebUI, 默认端口 16601)
# 3.4.0.0009 起 open_type=inner: www/ 为完整前端镜像(爬取自二进制内嵌 dist), /api 网关反代
# 注意: Lucky 3.4.0 为 go1.27+ 编译, start.sh 必须带 GODEBUG 消毒(UGOS 全局注入
# GODEBUG=tlskyber=0 会让其启动即 fatal, 已实测)
# ============================================================

# 配置规范版本
spec_version: "2.1"

# 应用ID（上架后不可修改）
app_id: com.gdy666.lucky

# 应用版本号 x.y.z（打包时 --build 追加构建号）
version: 3.4.0

# 支持的 CPU 架构
support_arch:
  - amd64
  - arm64

# 支持的客户端类型
supports:
  - pc
  - app

# 启动命令：调用封装脚本（准备配置目录后 exec lucky -cd）
start_cmd: bin/start.sh

# WebUI 服务端口（Lucky 默认管理端口 16601，供系统探测启动状态；
# 请勿在 Lucky 后台修改管理端口，否则应用图标将打不开管理页）
port: 16601

# 打开方式：桌面内嵌窗口（网关 serve rootfs_common/www 的前端镜像 +
# /api 反代后端 16601；WS 已全部挂在 /api 前缀，webterminal/SFTP 可用）
open_type: inner

# 反代前缀：Lucky v3 的 API/WebSocket 全部原生挂在 /api/* 下，
# 网关不剥离前缀，直接透传
proxy_path: api

# 应用类别
tag_types:
  - utility

# 依赖的最低固件版本
depend_fw_version: 1.13.0.0000

# 允许用户在应用设置中授权访问共享/个人文件夹
# （供 FTP/WebDAV/文件浏览 模块共享 NAS 目录使用，可授权多个）
allow_add_access_path: true

# 支持迁移安装目录
support_migration: true

# 声明权限：DDNS/内网穿透/反代必须联网；启动脚本与 cron/WOL 等模块需执行系统命令
permissions:
  - NETWORK.ACCESS_INTERNET
  - SYSTEM.EXEC_SYSTEM_COMMAND

# 开源合规信息（使用开源代码必填）
license_agreement_link:
  - https://github.com/gdy666/lucky/blob/master/LICENSE
source_code_link:
  - https://github.com/gdy666/lucky
technical_support_link:
  - https://github.com/gdy666/lucky/issues

# 应用展示信息（多语言）
i18n:
  en-US:
    name: Lucky
    description: >-
      Lucky (v3) — an all-in-one network toolbox: reverse proxy, DDNS,
      STUN NAT traversal, IPv6/IPv4 port forwarding, cron tasks, ACME
      certificates, WebDAV/FTP/file browser, Wake-on-LAN, Cloudflare Tunnel,
      IP firewall, plus new v3 modules (Coraza WAF, storage management,
      web terminal), with a built-in Web UI. Default login: 666 / 666 —
      change it after first login. Notes: runs as a non-root app user, ports
      below 1024 cannot be bound (SMB 445 / DLNA 1900 need high ports);
      do not change the admin port (16601) or the app icon will break;
      v3 uses a brand-new config format — after upgrading from v2, Lucky
      starts with a fresh config. The wanji build's Docker container manager
      needs docker.sock and is unavailable inside the app sandbox. The app
      opens embedded in the desktop; the gateway rejects request bodies over
      20MB (413) — for large transfers open http://NAS_IP:16601 directly.
      If the page misbehaves after an upgrade, force-refresh the browser.
    author: gdy666
    official: https://lucky666.cn
    help: https://lucky666.cn
    publisher: gdy666
    publisher_link: https://github.com/gdy666
  zh-CN:
    name: Lucky
    description: >-
      Lucky(v3) —— 软硬路由公网神器/网络工具箱：反向代理、DDNS 动态域名、
      STUN 内网穿透、IPv6/IPv4 端口转发、计划任务、ACME 证书自动申请、
      WebDAV/FTP/文件浏览、网页唤醒(WOL)、Cloudflare Tunnel、IP 防火墙等，
      v3 新增 Coraza WAF、存储管理、Web 终端等模块，自带 Web 管理界面。
      默认登录账号 666，密码 666，首次登录后请及时修改。
      注意：应用以普通用户运行，无法监听 1024 以下端口(SMB 445/DLNA 1900 等请改高位端口)；
      请勿在 Lucky 后台修改管理端口(16601)，否则应用图标将无法打开管理页；
      v3 采用全新配置格式，与 v2 配置不互通，从 v2 升级后将以全新配置启动；
      万吉版内置的 Docker 容器管理模块依赖 docker.sock，在应用沙箱中不可用。
      应用以桌面内嵌窗口方式打开；受系统网关限制，单次上传超过 20MB 的请求会被
      拒绝(413)，大文件上传/下载请直连 http://NAS_IP:16601 使用；
      设置安全入口后内嵌窗口可能无法访问，请改用浏览器直连；
      应用升级后如页面显示异常，请强制刷新浏览器缓存。
    author: gdy666
    official: https://lucky666.cn
    help: https://lucky666.cn
    publisher: gdy666
    publisher_link: https://github.com/gdy666
