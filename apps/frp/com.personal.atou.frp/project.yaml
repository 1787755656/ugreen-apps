# ============================================================
# FRP 内网穿透 —— UGOS Pro 原生应用配置
#
# 上游: https://github.com/fatedier/frp  (Apache-2.0)
# frpc/frps 取上游官方 release 静态二进制,不改动;
# Go 管理壳(frp-mgr)负责:网页登录(出厂密码 frpadmin)、frps.toml/frpc.toml
# 编辑与 frp 内置 verify 校验、双进程守护(自动重启/退避)、日志查看。
# inner 形态(桌面内嵌窗口):页面由网关从 www/ 提供,/api/ 反代到管理壳;
# 管理页仍是自家密码会话(不接 UGOS 网关身份),会话令牌走 Authorization 头,
# 不依赖 Cookie(网关会压 SameSite=Strict,PC 客户端还拒收第三方 Cookie)。
# 管理壳用 go1.26 线编译:固件注入的 GODEBUG 对 go1.27+ 二进制是 fatal;
# 子进程 env 另做 GODEBUG 消毒(防上游换工具链)。
# ============================================================

spec_version: "2.1"

app_id: com.personal.atou.frp

# 跟随上游版本 v0.72.0(CI 按上游 latest 改写此行)
version: 0.72.0

support_arch:
  - amd64
  - arm64

# 留空 = 平台默认写入 app+pc;inner 应用在手机端会跳转手机浏览器打开,实测可用。
supports: []

# 启动命令:Go 管理壳。--port 必须和下面的 port 一致。
# 管理壳端口避开上游默认(7000/7500)与本机常见占用,取 28600。
start_cmd: bin/frp-mgr --port=28600

# 后端真实监听端口,平台用它探活。
port: 28600

# 网关反代前缀:只有 /api/ 会转给管理壳,其余路径由网关从 www/ 静态提供
# (网关不剥离该前缀,后端路由本来就注册成 /api/xxx)。
proxy_path: api

# inner:在 UGOS 桌面里内嵌打开(不再是浏览器新标签直连端口)。
open_type: inner

tag_types:
  - utility

depend_fw_version: 1.13.0.0000

# frpc 要连公网服务端、frps 要被公网客户端连入,默认 unit 只放私网,
# 不声明 INTERNET 等于废掉一半功能。EXEC 不需要:壳只 exec 包内二进制。
permissions:
  - NETWORK.ACCESS_INTERNET

# 开源合规(Apache-2.0)
license_agreement_link:
  - https://github.com/fatedier/frp/blob/dev/LICENSE
source_code_link:
  - https://github.com/fatedier/frp
technical_support_link:
  - https://github.com/fatedier/frp/issues

i18n:
  zh-CN:
    name: FRP 内网穿透
    description: >-
      FRP 内网穿透(fatedier/frp)一体化管理,内置服务端 frps 与客户端
      frpc 双角色,可单独或同时启用。服务端把 NAS 做成穿透节点供其它
      机器接入,客户端把 NAS 上的 SSH、相册、下载工具等服务映射到远端
      frp 服务器。自带网页管理壳:直接编辑两份配置文件,保存时自动
      调用 frp 内置校验防止写坏,支持一键启停、重启与实时日志查看。
      默认管理密码 frpadmin(区分大小写),登录后在页面右上角「修改
      密码」里改成自己的密码,顶部提醒条会一直提示直到改掉。忘记密码
      可删除应用数据目录下的 manager.json 再重启应用,密码恢复为默认
      值(两个服务的启用状态会一并重置)。从桌面图标打开即可使用。
    author: fatedier
    official: https://gofrp.org
    help: https://gofrp.org/zh-cn/docs/
    publisher: atou
  en-US:
    name: FRP Tunnel
    description: >-
      All-in-one management for frp (fatedier/frp) with both roles
      built in - run frps to turn the NAS into a tunnel server, or frpc
      to expose NAS services (SSH, photos, downloads) through a remote
      frp server. Ships a web console: edit both config files in the
      browser with built-in frp validation on save, one-click start,
      stop and restart, plus live logs. The default admin password is
      frpadmin (case-sensitive); change it via "Change password" in the
      top-right corner after signing in - a banner keeps reminding you
      until you do. Forgot it? Delete manager.json in the app data
      directory and restart the app to restore the default (service
      enable states are reset too). Open it from the desktop icon.
    author: fatedier
    official: https://gofrp.org
    help: https://gofrp.org/zh-cn/docs/
    publisher: atou
