# ============================================================
# DeepSeek Harness (DSH) — UGOS Pro Docker 应用
#
# DSH = DeepSeek 官方的 agent harness（npm 包 @deepseek-ai/dsh，MIT）。
# 包内镜像为 smanx/deepseek-harness 的 devtools-min 变体：
#   - DSH 官方出于安全考虑禁止 --host 0.0.0.0，只能监听回环地址；
#     镜像内置 Node 反代 0.0.0.0:3080 → 127.0.0.1:3079，让局域网可访问；
#   - 反代给 HTML 注入 crypto.randomUUID polyfill（局域网 IP 页面属于
#     浏览器非安全上下文，不注入则实时通道 WS 永远 pending），并自动
#     转发 /api/events.mux、/api/events.host 两条 WebSocket 通道；
#   - 选 devtools-min 而非 slim 的原因：内置 pnpm（dsh plugin /
#     dsh-market 插件市场需要）与 uv（uvx/uv 启动的 MCP server 需要），
#     slim 变体两者皆无。
#   镜像上游：https://github.com/smanx/deepseek-harness-docker
#
# 版本：镜像 tag 与 DSH 版本一一对应（形如 0.2.1-rc.4，上游目前只发
# 预发布）。project.yaml 的 version 只能 x.y.z，取 rc 前的数值段；
# 同一 x.y.z 的不同 rc 靠构建号（pack --build）递增区分。
#
# 端口：容器内反代固定 3080，宿主映射 23079（3080 在 NAS 上是常见
# 软件端口，且 UGOS 侧探活端口不照抄上游默认）。
#
# 认证：DSH 自身无内置账号体系（首次打开按界面引导初始化），局域网
# 防护靠镜像的可选 HTTP Basic Auth —— 安装参数「用户名/密码」两个都填
# 才启用（与上游语义一致），留空则局域网内可直接访问。
# ============================================================

spec_version: "2.1"
app_id: com.personal.deepseekharness
version: 0.2.1

support_arch:
  - amd64
  - arm64

supports:
  - pc
  - app

is_docker_app: true

# Docker 应用必填
depend_docker_version: 1.7.0.0000
depend_fw_version: 1.13.0.0000

# 宿主探活端口 = compose 里 "23079:3080" 的宿主侧
port: 23079

# Docker 应用只能 tab（inner 平台会塞一份只 serve 静态目录的 nginx → 404）
open_type: tab

# DSH 是跑 AI agent 的工具（会在容器内执行命令、存模型 API Key），
# 桌面图标只给管理员
only_admin: true

tag_types:
  - devtool

parameters:
  # DSH 数据目录（配置、会话、凭据，容器内 /root/.dsh）。
  # 选填：留空用应用安装目录内 data/；手动 Docker 部署过 DSH 的可选旧
  # 数据目录（挂载过 /root/.dsh 的那个）直接沿用会话与配置。
  - key: DSH_DATA
    type: path
    multi: false
    changeable: true
    required: false
    i18n:
      zh-CN:
        name: 数据目录
        description: >-
          存放 DSH 的配置、会话记录与凭据（对应容器内 /root/.dsh）。
          留空则使用应用安装目录内的 data 文件夹。若你之前用 Docker 手动
          部署过 DeepSeek Harness，想沿用旧数据，请选择旧容器挂载
          /root/.dsh 的那个目录。安装或修改后请在应用中心
          「停止 → 启动」一次使其生效。
      en-US:
        name: Data directory
        description: >-
          Stores DSH configuration, sessions and credentials (mounted as
          /root/.dsh in the container). Leave empty to use the data folder
          inside the app install directory. To reuse data from a previous
          manual Docker deployment of DeepSeek Harness, pick the directory
          that was mounted as /root/.dsh. Stop and start the app once after
          install or change.

  # 局域网口令（HTTP Basic Auth）用户名/密码，两个都填才启用（上游语义）。
  - key: PROXY_USERNAME
    type: string
    multi: false
    changeable: true
    required: false
    i18n:
      zh-CN:
        name: 代理认证用户名（可选）
        description: >-
          访问页面的 HTTP Basic Auth 用户名。必须与下面的密码【同时填写】
          才启用认证；任一留空则局域网内任何设备都能直接打开页面。
          请避免使用英文引号。修改后需「停止 → 启动」一次生效。
      en-US:
        name: Proxy auth username (optional)
        description: >-
          HTTP Basic Auth username for the web page. Authentication is
          enabled only when BOTH this and the password below are filled;
          if either is empty, any device on the LAN can open the page.
          Avoid English quotes. Stop and start the app once to apply.

  - key: PROXY_PASSWORD
    type: password
    multi: false
    changeable: true
    required: false
    i18n:
      zh-CN:
        name: 代理认证密码（可选）
        description: >-
          访问页面的 HTTP Basic Auth 密码。必须与用户名【同时填写】才启用
          认证（对 HTTP 与 WebSocket 都生效）。请避免使用英文引号。
          修改后需「停止 → 启动」一次生效。
      en-US:
        name: Proxy auth password (optional)
        description: >-
          HTTP Basic Auth password for the web page. Enabled only when
          filled together with the username (applies to both HTTP and
          WebSocket). Avoid English quotes. Stop and start the app once
          to apply.

i18n:
  zh-CN:
    name: DeepSeek Harness
    description: >-
      DeepSeek Harness（DSH）是 DeepSeek 官方的 AI agent 工作台：浏览器里
      即可驱动智能体执行任务、管理插件与 MCP 工具。本应用内置 DSH 官方
      npm 包与一层 Node 反向代理（镜像来自 smanx/deepseek-harness 的
      devtools-min 变体）。

      反向代理解决的问题：DSH 官方出于安全只允许监听回环地址，代理将其
      转发到局域网可达的端口（本应用为 23079），并自动注入局域网访问
      必需的浏览器兼容补丁、转发实时通信的 WebSocket 通道——开箱即用，
      打开即见 DSH 界面，首次使用按页面引导配置模型 API Key 即可。

      内置 pnpm 与 uv：dsh 插件市场（dsh plugin）和以 uvx/uv 方式启动的
      MCP server 均可开箱即用。

      可选局域网口令：DSH 界面本身没有登录体系，如需防止局域网内其他
      设备访问，请在应用「配置」里填写代理认证用户名与密码（两个都填
      才启用，HTTP 与 WebSocket 都会要求认证）。智能体会在容器内执行
      命令、数据目录存有 API Key，请不要将端口暴露到公网。

      数据目录可在「配置」中指定：留空用应用目录内 data 文件夹；之前
      手动 Docker 部署过 DSH 的可选旧数据目录沿用会话。修改配置或安装后
      请在应用中心「停止 → 启动」一次。容器名 deepseek-harness：若之前
      手动跑过同名或同端口的容器，请先停止并删除旧容器。
    author: smanx
    official: https://github.com/smanx/deepseek-harness-docker
    help: https://github.com/deepseek-ai/deepseek-harness/discussions/1762
    publisher: 穿斯帕沃特
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131
  en-US:
    name: DeepSeek Harness
    description: >-
      DeepSeek Harness (DSH) is the official AI agent workbench from
      DeepSeek: drive agents, plugins and MCP tools from the browser.
      This app bundles the official DSH package with a Node reverse proxy
      (smanx/deepseek-harness, devtools-min variant) that exposes the
      loopback-only DSH on port 23079, injects the browser polyfill
      required on LAN IPs and forwards the realtime WebSocket channels.

      Open the app and follow the first-run guide to set your model API
      key. pnpm and uv are preinstalled, so the dsh plugin marketplace
      and uvx-launched MCP servers work out of the box.

      The DSH UI has no login system. To keep other LAN devices out, set
      the proxy auth username and password in the app settings (both
      required). Agents run commands inside the container and API keys
      live in the data directory - never expose this port to the
      internet.

      The data directory can be changed in the app settings to reuse a
      previous manual deployment's /root/.dsh.
    author: smanx
    official: https://github.com/smanx/deepseek-harness-docker
    help: https://github.com/deepseek-ai/deepseek-harness/discussions/1762
    publisher: 穿斯帕沃特
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131

# 合规：DSH 官方 MIT；打包镜像层来源 smanx/deepseek-harness-docker
license_agreement_link:
  - https://github.com/deepseek-ai/deepseek-harness/blob/main/LICENSE
source_code_link:
  - https://github.com/deepseek-ai/deepseek-harness
  - https://github.com/smanx/deepseek-harness-docker
