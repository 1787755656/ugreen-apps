# ============================================================
# DeepSeek Harness (DSH) — Docker Compose 编排（UGOS Pro Docker 应用）
#
# ⚠ 这个文件是 Go text/template，不是 compose 的美元大括号变量语法（真机实测）。
#   parameters 声明的值一律是列表，取值要用 index 取第 0 项；选填参数必须套
#   if 判空（index 作用在空列表上会让安装渲染直接失败）。
#   模板控制语句挂在井号注释位：YAML 当注释、模板照样执行，渲染后剩下的
#   井号行仍是合法注释。注释里不要写双花括号字面量（会被模板当真执行）。
#   TZ 是 Docker 套件注入的内置变量，标量，可以直接整页引用。
#
# 编排与上游镜像默认用法一致：
#   容器内 DSH 监听 127.0.0.1:3079（官方安全限制，只允许回环），
#   Node 反代监听 0.0.0.0:3080 对外，宿主端口 23079 映射到反代。
#   /root/.dsh 是 DSH 的配置/会话/凭据目录。
# ============================================================

name: deepseek-harness

services:
  deepseek-harness:
    # 镜像随包内置（rootfs_<arch>/images/deepseek-harness-<版本>-<arch>.tar，
    # 安装时 docker load，离线可装、不依赖 Docker Hub 镜像源）。内容即
    # smanx/deepseek-harness:devtools-min-<版本>（内置 pnpm 与 uv，
    # dsh 插件市场与 uvx 启动的 MCP server 开箱即用）。上游仅提供
    # 浮动 tag，平台禁止 latest，故钉版本 tag 并改标 personal/ 前缀；
    # 具体版本由打包脚本 sed 改写。
    image: personal/deepseek-harness:0.2.1-rc.4
    container_name: deepseek-harness
    restart: unless-stopped
    # 【UGOS 打包补丁】DSH 给会话 cookie 加的是 SameSite=Strict，而 UGOS 桌面/客户端
    # 点开本应用是从自家页面发起的跨站导航：Strict cookie 在整条导航链（含 303 跟随）
    # 上浏览器都不回传，于是「根目录 401 → 携带 launch token 重发 → 303 → 浏览器跟随
    # 但又不带 cookie」无限循环（真机 2026-10-30）。放宽为 Lax：顶层 GET 导航会携带
    # （Lax 放行安全的顶层导航），跨站 POST 依旧不携带，CSRF 防护不损失；直接输网址
    # 打开本就同站，无感。每次启动对反代源码就地生效；若上游改了代码导致不命中，只打
    # 警告照常启动（退化为未打补丁的原行为，不会把应用搞挂）。上游若内置修复，可整段删除。
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -i "s|hs\['Set-Cookie'\] = r.setCookies;|hs['Set-Cookie'] = r.setCookies.map((c) => c.replace(/SameSite=Strict/ig, 'SameSite=Lax'));|" /app/proxy/upstream-token.js
        sed -i "s|proxy.on('proxyRes', (proxyRes, req, res) => {|&\n  const _sc = proxyRes.headers['set-cookie'];\n  if (_sc) proxyRes.headers['set-cookie'] = (Array.isArray(_sc) ? _sc : [_sc]).map((c) => c.replace(/SameSite=Strict/ig, 'SameSite=Lax'));|" /app/proxy/index.js
        if grep -q "SameSite=Lax" /app/proxy/upstream-token.js && grep -q "SameSite=Lax" /app/proxy/index.js; then
          echo "[ugos-patch] DSH 会话 cookie SameSite Strict→Lax 补丁已生效（修复跨站打开时的 401 重定向循环）"
        else
          echo "[ugos-patch] 警告：上游反代代码结构变化，SameSite 补丁未命中，跨站打开可能出现 401 重定向循环"
        fi
        exec /app/entrypoint.sh
    ports:
      # 宿主 23079（project.yaml 的探活端口）→ 容器内反代 3080
      - "23079:3080"
    environment:
      TZ: "{{.TZ}}"
      # 源端口：DSH 在容器内监听（仅回环），反代的 upstream
      DSH_PORT: "3079"
      # 代理端口：反代对容器外监听（与上方端口映射的容器侧一致）
      PROXY_PORT: "3080"
      # 局域网口令（HTTP Basic Auth）：两个参数都有值才注入（上游语义：
      # 只填其一时完全放行）。凭据对 HTTP 与 WebSocket 都生效。
      #{{ if and .PROXY_USERNAME .PROXY_PASSWORD }}
      PROXY_USERNAME: "{{ index .PROXY_USERNAME 0 }}"
      PROXY_PASSWORD: "{{ index .PROXY_PASSWORD 0 }}"
      #{{ end }}
    volumes:
      # DSH 数据目录（容器内 /root/.dsh）：选了文件夹就绑它，留空用平台数据区。
      # ⚠ 不能用应用安装目录内的相对路径（./data）：平台升级会替换整个安装目录，
      #   数据会被清掉（2026-10-30 真机踩坑）。/volume1/@appdata/<appid>/ 是平台
      #   持久数据区，升级与卸载（保留数据）都不动它；目录不存在时 docker 会自建。
      #{{ if .DSH_DATA }}
      - type: bind
        source: "{{ index .DSH_DATA 0 }}"
        target: /root/.dsh
      #{{ else }}
      - type: bind
        source: "/volume1/@appdata/com.personal.deepseekharness/data"
        target: /root/.dsh
      #{{ end }}
