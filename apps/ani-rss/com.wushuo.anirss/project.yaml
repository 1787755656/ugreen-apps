# ass (ANI-RSS) — UGOS Pro 原生应用
# 内置 Eclipse Temurin JRE + 官方 ani-rss.jar；显示名 ass
spec_version: "2.1"

app_id: com.wushuo.anirss
version: 0.0.0

support_arch:
  - amd64
  - arm64

supports:
  - pc
  - app

start_cmd: bin/start.sh
port: 7789
open_type: tab

tag_types:
  - download
  - media
  - utility

depend_fw_version: 1.13.0.0000

allow_add_access_path: true
support_migration: true

# 安装时就把媒体/下载目录选好。
#
# 这个参数干的是两件事，第二件才是重点：
#   1. 在应用中心的安装/设置弹窗里渲染出文件夹选择器
#      （那个弹窗里的控件【只由 parameters 生成】，不声明就是个空弹窗）
#   2. 【顺带授权】—— 选中的目录会被记进平台的 path_permissions 表（from_type=1），
#      进而生成 systemd unit 里的 BindPaths=，沙箱里就直接读写得到了。
#      所以不用再让用户装完之后去「访问路径」里补一遍。
#
# ani-rss 是上游的第三方 jar，不会读这个环境变量——值本身用不上，
# 但 start.sh 会把解析出的目录打进启动日志，方便用户照着填 WebUI 里的下载路径。
# allow_add_access_path 保持开着：用户之后想加/换目录，走那条路仍然有效。
#
# 刻意【不设 required】：留空也能装、能跑（媒体目录退回应用数据目录下的 Media），
# 装不上比少个便捷入口糟得多。
parameters:
  - key: MEDIA_PATH
    type: path
    multi: true
    max_values_count: 8
    changeable: true
    i18n:
      zh-CN:
        name: 媒体与下载目录
        description: >-
          选择存放番剧的共享文件夹，可添加多个。选好即完成授权，之后在 WebUI 的
          下载路径里填这些目录即可。留空也能安装，装好后在应用「访问路径」里授权同样可以。
      en-US:
        name: Media & download folders
        description: >-
          Pick the shared folders where anime is stored; several are allowed.
          Picking them also grants access, so you can use these paths directly as
          the download path in the WebUI. Leaving this empty is fine.

# start.sh + jre/bin/java 均为 shell，必须保留 EXEC
permissions:
  - NETWORK.ACCESS_INTERNET
  - SYSTEM.EXEC_SYSTEM_COMMAND

license_agreement_link:
  - https://github.com/wushuo894/ani-rss/blob/master/LICENSE
source_code_link:
  - https://github.com/wushuo894/ani-rss
technical_support_link:
  - https://club.ugnas.com/forum.php?mod=viewthread&tid=5623

i18n:
  en-US:
    name: ass
    description: >-
      Auto subscribe, download and scrape anime via RSS (ANI-RSS). Bundles
      Eclipse Temurin JRE so no system Java is required. Default login admin/admin.
    author: wushuo894
    official: https://github.com/wushuo894/ani-rss
    help: https://docs.wushuo.top
    publisher: 穿斯帕沃特
    publisher_link: https://club.ugnas.com/forum.php?mod=viewthread&tid=5623
  zh-CN:
    name: ass
    description: >-
      基于 RSS 自动追番、订阅、下载、刮削与洗版（上游 ANI-RSS）。应用内置
      Eclipse Temurin JRE，无需 NAS 安装系统 Java。默认账号 admin / admin，
      登录后请及时修改密码。请在应用设置中授权媒体/下载共享目录，并在 WebUI
      中配置下载路径与下载器。
    author: wushuo894
    official: https://github.com/wushuo894/ani-rss
    help: https://docs.wushuo.top
    publisher: 穿斯帕沃特
    publisher_link: https://club.ugnas.com/forum.php?mod=viewthread&tid=5623
