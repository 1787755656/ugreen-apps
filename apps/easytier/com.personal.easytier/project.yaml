# ============================================================
# EasyTier — UGOS Pro Docker 应用
#
# 去中心化 mesh VPN（异地组网）：Core + Web 管理台一体镜像
# （镜像 majosissi/easytier，构建自上游 EasyTier 官方 release 产物，
#  entrypoint /run.sh 同时拉起 easytier-web-embed 与 easytier-core）。
#
# 来源：按用户桌面上的 docker-compose.yaml（真机在跑的同款部署）改编：
#   - 端口保持不变（Web 控制台 11211 / 配置服务器 22020），旧部署迁移时
#     书签与对端配置不用改。前提是迁移时先停掉并删除旧容器（同名同端口）。
#   - 数据卷改为可选 path 参数：留空用应用目录内 ./data（imgocr 同款做法）；
#     填了（如 /volume1/docker/easytier/data）可直接沿用旧部署数据。
#   - restart: always 改为 unless-stopped（平台惯例：aigw/imgocr 同款，
#     用户显式停止后不会在 docker daemon 重启时复活）。
#
# 架构：镜像上游构建 amd64/arm64 等 5 个平台，两架构都出包。
#
# ⚠ ugcli 对以下各项只 WARN 不拦，均为 VPN 组网的硬需求、有意为之：
#   network_mode: host（对端直连监听端口）、cap_add NET_ADMIN/NET_RAW、
#   挂载 /dev/net/tun、容器以 root 运行（TUN 需要）。
# ============================================================

spec_version: "2.1"
app_id: com.personal.easytier
version: 2.6.4

support_arch:
  - amd64
  - arm64

supports:
  - pc
  - app

is_docker_app: true

# Docker 应用必填
depend_docker_version: 1.7.0.0000
depend_fw_version: 1.13.0.0000

# Web 控制台端口（与 compose 的 WEB_PORT 一致，供系统探活）。
# 不照抄挪高位的理由：本应用就是用户现有同名部署的正式化替代，
# 端口保持一致迁移成本最低；旧容器需先删除（同名冲突，见描述）。
port: 11211

# Docker 应用只能 tab（inner 平台会塞一份只 serve 静态目录的 nginx → 404）。
# Web 控制台自带账号体系（admin/admin，注册已关，登录后可改密码），
# 认证用上游自己的 —— ugos-auth-standard-approach 的 tab 第三形态。
open_type: tab

# VPN 组网是全设备级管理功能，桌面图标只给管理员
only_admin: true

tag_types:
  - utility

support_migration: true

parameters:
  # 数据目录（Web 管理台账号、虚拟网络配置、日志的存放处，容器内 /app/data）。
  # 选填：留空用应用安装目录内 data/；已有旧部署时选旧数据目录可直接沿用。
  # ⚠ Docker 应用 parameters 值一律是列表，模板里必须 index 取第 0 项；
  #   选填参数模板必须套 if（index 作用在空列表上会在安装渲染时报错）。
  - key: EASYTIER_DATA
    type: path
    multi: false
    changeable: true
    required: false
    i18n:
      zh-CN:
        name: 数据目录
        description: >-
          存放 Web 管理台账号、虚拟网络配置与日志（对应容器内 /app/data）。
          留空则使用应用安装目录内的 data 文件夹。若你之前用 Docker 手动部署过
          EasyTier 并想沿用旧数据（网页账号、已配置的虚拟网络），请选择旧部署
          挂载的数据目录（其内应有 web、config、logs-core 等子目录）。
          安装或修改后请在应用中心「停止 → 启动」一次使其生效。
      en-US:
        name: Data directory
        description: >-
          Stores the web console account, virtual network configs and logs
          (mounted as /app/data in the container). Leave empty to use the data
          folder inside the app install directory. To reuse data from a previous
          manual Docker deployment (web account, existing networks), pick that
          deployment's data directory (it should contain web, config, logs-core
          subdirectories). Stop and start the app once after install or change.

i18n:
  zh-CN:
    name: EasyTier
    description: >-
      EasyTier 是一个去中心化的异地组网（mesh VPN）工具：各节点平等互联、无需中心服务器，
      支持 UDP/TCP/WSS/WG 多协议、NAT 穿透、子网代理（把 NAS 所在局域网共享给整个虚拟网络）
      与智能路由，流量可用 WireGuard 或 AES-GCM 加密。

      本应用为「核心 + Web 管理台」一体部署：安装后从桌面打开即进入 Web 管理台
      （端口 11211，内置账号 admin / admin，注册已关闭，请登录后立即修改密码）。
      在管理台里创建或加入虚拟网络，即可让 NAS 与你的其他设备组成跨地域的虚拟局域网。

      注意：
      · 组网需要宿主网络与 TUN 网卡：容器使用 host 网络模式、挂载 /dev/net/tun，
        并需要 NET_ADMIN / NET_RAW 权限，安装时的告警属正常现象。
      · 如果你之前已用 Docker 手动部署过 EasyTier：容器同名（easytier）、端口相同
        （11211/22020），请先停止并【删除】旧容器再启动本应用，否则会因端口与名字冲突起不来。
      · 数据目录可在安装时指定，旧部署的 /app/data 数据可通过指定目录直接沿用。
    author: MajoSissi
    official: https://github.com/MajoSissi/EasyTier
    help: https://easytier.cn/
    publisher: 穿斯帕沃特
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131
  en-US:
    name: EasyTier
    description: >-
      EasyTier is a decentralized mesh VPN: nodes connect as equals with no
      central server, over UDP/TCP/WSS/WG with NAT traversal, subnet proxying
      and intelligent routing; traffic can be encrypted with WireGuard or
      AES-GCM.

      This app runs the core and the web console together. Open it from the
      desktop to reach the web console (port 11211, built-in account admin /
      admin, registration disabled — change the password right after the
      first login) and create or join a network to link your NAS with your
      other devices into one virtual LAN across locations.

      Notes:
      · Networking needs host network and a TUN device — related install
      warnings are expected.
      · If you previously ran EasyTier via manual Docker: same container name
      (easytier) and ports (11211/22020). Stop and REMOVE the old container
      before starting this app.
      · A data directory can be chosen at install time to reuse an old
      /app/data.
    author: MajoSissi
    official: https://github.com/MajoSissi/EasyTier
    help: https://easytier.cn/
    publisher: 穿斯帕沃特
    publisher_link: https://club.ugnas.com/home.php?mod=space&uid=10131

