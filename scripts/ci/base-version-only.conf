# BASE_VERSION_ONLY 应用名单（scripts/ci/resolve-release-tag.sh 读取，每行一个 slug）
#
# 名单内应用每天 schedule 跟上游时，只有【基础版本 x.y.z】变化才触发自动
# 构建；同一 x.y.z 内的预发布迭代一律视为已发布、直接跳过：
#   · octop            上游 tag v1.0.3b1→b2→b3…（bN beta 连发）
#   · deepseek-harness 镜像 tag 0.2.1-rc.4→rc.5→rc.6…（rc/alpha 连发）
# 背景：这两处上游处于快速发展期，逐版跟会让 project.yaml 版本纹丝不动、
# 只有第 4 段构建号在涨，商店里表现为无意义刷版。
#
# 不影响的能力：
#   · 基础版本真变了（如 0.2.1 → 0.2.2）照常自动构建；
#   · 手动 workflow_dispatch 指定 version/revision 仍可强出同 base 的包或 -rN。
#
# 新增应用直接加一行。本目录（scripts/ci/**）的改动不会触发任何应用的
# push 构建（build-apps.yml 的 detect 明确排除），改名单零副作用。
octop
deepseek-harness
baota
